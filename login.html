<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Dreamplay</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .login-container {
            min-height: 100vh;
            background: linear-gradient(rgba(15, 15, 30, 0.9), rgba(45, 27, 105, 0.8));
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 100px 2rem 2rem;
        }

        .login-form {
            background: rgba(255, 255, 255, 0.1);
            padding: 3rem;
            border-radius: 20px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            width: 100%;
            max-width: 400px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
        }

        .login-form h2 {
            text-align: center;
            color: var(--projector-gold);
            margin-bottom: 0.5rem;
            font-size: 2rem;
        }

        .login-subtitle {
            text-align: center;
            color: var(--gray-text);
            margin-bottom: 2rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            color: var(--light-text);
            margin-bottom: 0.5rem;
            font-weight: bold;
        }

        .form-group input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.1);
            color: var(--light-text);
            font-size: 1rem;
            transition: border-color 0.3s;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--neon-cyan);
        }

        .forgot-password {
            text-align: right;
            margin-bottom: 1.5rem;
        }

        .forgot-password a {
            color: var(--neon-cyan);
            text-decoration: none;
            font-size: 0.9rem;
        }

        .register-link {
            text-align: center;
            margin-top: 1.5rem;
            color: var(--gray-text);
        }

        .register-link a {
            color: var(--neon-cyan);
            text-decoration: none;
        }
    </style>
</head>
<body>
    <header class="header">
        <nav class="navbar">
            <div class="logo">DREAMPLAY</div>
            <ul class="nav-links">
                <li><a href="index.html">Inicio</a></li>
                <li><a href="index.html#explorar">Explorar</a></li>
                <li><a href="register.html">Registrarse</a></li>
                <li><a href="#login">Iniciar Sesión</a></li>
            </ul>
        </nav>
    </header>

    <section class="login-container">
        <div class="login-form">
            <h2>Bienvenido de Vuelta</h2>
            <p class="login-subtitle">Accede a tu cuenta de Dreamplay</p>

            <form id="loginForm">
                <div class="form-group">
                    <label for="email">Email o Usuario</label>
                    <input type="text" id="email" name="email" required placeholder="tu@email.com o @usuario">
                </div>

                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" name="password" required placeholder="Tu contraseña">
                </div>

                <div class="forgot-password">
                    <a href="#">¿Olvidaste tu contraseña?</a>
                </div>

                <button type="submit" class="cta-button" style="width: 100%;">
                    🎬 Iniciar Sesión
                </button>

                <div class="register-link">
                    ¿No tienes cuenta? <a href="register.html">Regístrate aquí</a>
                </div>
            </form>
        </div>
    </section>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            // Aquí normalmente validaríamos con un servidor
            alert('✅ ¡Inicio de sesión exitoso! Redirigiendo...');
            window.location.href = 'index.html';
        });
    </script>
</body>
</html>
